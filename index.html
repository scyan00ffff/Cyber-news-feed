<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>// CYBERFEED</title>

<!-- ===== iPad / home-screen web-app behaviour ===== -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CYBERFEED">
<meta name="theme-color" content="#0a0a0f">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230a0a0f'/%3E%3Crect x='6' y='6' width='168' height='168' fill='none' stroke='%2300f0ff' stroke-width='4'/%3E%3Ctext x='90' y='108' font-family='monospace' font-size='64' font-weight='bold' fill='%2300f0ff' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">

<!-- ===== Fonts ===== -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
/* =========================================================
   THEME VARIABLES — tweak colours here
   ========================================================= */
:root{
  --bg:            #0a0a0f;
  --bg-elevated:   #101018;
  --bg-card:       #13131d;
  --border:        #23232f;
  --border-hover:  #3a3a4a;

  --cyan:          #00f0ff;
  --magenta:       #ff2a6d;
  --purple:        #b967ff;
  --green:         #39ff14;
  --amber:         #ffb02e;

  --text:          #e8e8f2;
  --text-dim:      #9494a8;
  --text-faint:    #5c5c70;

  --cat-cyber:     var(--cyan);
  --cat-geopol:    var(--magenta);
  --cat-watchlist: var(--amber);

  --font-display:  'Orbitron', sans-serif;
  --font-mono:     'JetBrains Mono', monospace;
  --font-body:     'Inter', -apple-system, sans-serif;
}

*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  margin:0; padding:0; height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}

body{
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,240,255,0.07), transparent),
    radial-gradient(ellipse 60% 40% at 100% 0%, rgba(255,42,109,0.06), transparent);
  background-attachment:fixed;
  padding-bottom:calc(2.5rem + env(safe-area-inset-bottom));
}

a{ color:inherit; }
button{ font-family:inherit; }

/* =========================================================
   HEADER
   ========================================================= */
header{
  position:sticky; top:0; z-index:50;
  background:rgba(10,10,15,0.88);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid var(--border);
  padding:env(safe-area-inset-top) 0 0 0;
}

.header-inner{
  max-width:1400px; margin:0 auto;
  padding:0.9rem 1.25rem 0.75rem;
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  flex-wrap:wrap;
}

.brand{ display:flex; align-items:center; gap:1rem; }

.logo{
  position:relative;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(1.3rem, 2.4vw, 1.9rem);
  letter-spacing:0.06em;
  color:var(--text);
  text-shadow:0 0 12px rgba(0,240,255,0.55), 0 0 28px rgba(0,240,255,0.25);
  white-space:nowrap;
}
.logo::before, .logo::after{
  content:attr(data-text);
  position:absolute; left:0; top:0; width:100%;
  overflow:hidden; background:var(--bg);
  clip-path:inset(0 0 0 0);
}
.logo::before{ color:var(--cyan); z-index:-1; animation:glitch-1 5.2s infinite steps(1); }
.logo::after{ color:var(--magenta); z-index:-2; animation:glitch-2 5.2s infinite steps(1); }
@keyframes glitch-1{
  0%,92%,100%{ clip-path:inset(0 0 0 0); transform:translate(0,0); opacity:0; }
  93%{ clip-path:inset(10% 0 60% 0); transform:translate(-2px,0); opacity:0.85; }
  95%{ clip-path:inset(60% 0 5% 0); transform:translate(2px,0); opacity:0.85; }
  97%{ clip-path:inset(30% 0 40% 0); transform:translate(-1px,0); opacity:0.85; }
}
@keyframes glitch-2{
  0%,92%,100%{ clip-path:inset(0 0 0 0); transform:translate(0,0); opacity:0; }
  93%{ clip-path:inset(70% 0 5% 0); transform:translate(2px,0); opacity:0.85; }
  95%{ clip-path:inset(15% 0 55% 0); transform:translate(-2px,0); opacity:0.85; }
  97%{ clip-path:inset(45% 0 20% 0); transform:translate(1px,0); opacity:0.85; }
}

.status-line{
  font-family:var(--font-mono); font-size:0.72rem; color:var(--text-faint);
  display:flex; align-items:center; gap:0.5rem; white-space:nowrap;
}
.status-dot{
  width:7px; height:7px; border-radius:50%; background:var(--green);
  box-shadow:0 0 6px var(--green), 0 0 12px var(--green);
  animation:pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

.controls{ display:flex; align-items:center; gap:0.7rem; }

/* Shared circular icon button (refresh / filter toggle) */
.icon-btn{
  position:relative;
  width:42px; height:42px; border-radius:50%;
  border:1px solid var(--border); background:var(--bg-elevated);
  color:var(--cyan); font-size:1.15rem;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:border-color .2s, box-shadow .2s, transform .15s;
  flex-shrink:0;
}
.icon-btn:hover{ border-color:var(--cyan); box-shadow:0 0 14px rgba(0,240,255,0.35); }
.icon-btn:active{ transform:scale(0.92); }
.icon-btn.spinning svg{ animation:spin 0.9s linear infinite; }
.icon-btn.active-state{ border-color:var(--purple); color:var(--purple); box-shadow:0 0 14px rgba(185,103,255,0.4); }
@keyframes spin{ to{ transform:rotate(360deg); } }

.filter-badge{
  position:absolute; top:-4px; right:-4px;
  min-width:16px; height:16px; padding:0 3px;
  border-radius:100px; background:var(--purple); color:#0a0a0f;
  font-family:var(--font-mono); font-size:0.62rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 8px rgba(185,103,255,0.7);
}

/* =========================================================
   SEARCH BAR
   ========================================================= */
.search-row{
  max-width:1400px; margin:0 auto;
  padding:0 1.25rem 0.75rem;
}
.search-wrap{
  position:relative; display:flex; align-items:center;
  border:1px solid var(--border); border-radius:8px;
  background:var(--bg-elevated);
  transition:border-color .2s, box-shadow .2s;
}
.search-wrap:focus-within{
  border-color:var(--cyan);
  box-shadow:0 0 14px rgba(0,240,255,0.3);
}
.search-icon{ margin-left:0.75rem; color:var(--text-faint); flex-shrink:0; }
#search-input{
  flex:1; min-width:0; border:none; background:transparent; outline:none;
  color:var(--text); font-family:var(--font-mono); font-size:0.85rem;
  padding:0.7rem 0.5rem; min-height:44px;
}
#search-input::placeholder{ color:var(--text-faint); }
.search-clear{
  border:none; background:transparent; color:var(--text-faint);
  font-size:1.3rem; line-height:1; cursor:pointer; padding:0 0.9rem;
  min-height:44px; min-width:44px;
  transition:color .2s;
}
.search-clear:hover{ color:var(--magenta); }

/* Tabs */
.tabs{
  max-width:1400px; margin:0 auto;
  padding:0 1.25rem 0.9rem;
  display:flex; gap:0.5rem; flex-wrap:wrap;
}
.tab{
  font-family:var(--font-mono); font-weight:500; font-size:0.85rem;
  letter-spacing:0.05em; text-transform:uppercase;
  padding:0.55rem 1rem; min-height:44px;
  display:flex; align-items:center;
  border-radius:6px; border:1px solid var(--border);
  background:var(--bg-elevated); color:var(--text-dim);
  cursor:pointer; transition:all .18s; user-select:none;
}
.tab .count{ color:var(--text-faint); margin-left:0.45em; }
.tab:hover{ border-color:var(--border-hover); color:var(--text); }
.tab.active{ color:var(--bg); font-weight:700; }
.tab.active .count{ color:rgba(10,10,15,0.6); }
.tab[data-tab="all"].active{ background:var(--text); border-color:var(--text); box-shadow:0 0 16px rgba(232,232,242,0.25); }
.tab[data-tab="cyber"].active{ background:var(--cyan); border-color:var(--cyan); box-shadow:0 0 16px rgba(0,240,255,0.5); }
.tab[data-tab="geopol"].active{ background:var(--magenta); border-color:var(--magenta); box-shadow:0 0 16px rgba(255,42,109,0.5); }

/* =========================================================
   FILTER PANEL (collapsible)
   ========================================================= */
#filter-panel{
  max-width:1400px; margin:0 auto;
  padding:0 1.25rem;
  max-height:0; overflow:hidden;
  transition:max-height .3s ease;
}
#filter-panel.open{ max-height:2600px; padding-bottom:1rem; }

.filter-panel-inner{
  border:1px solid var(--border); border-radius:10px;
  background:var(--bg-elevated);
  padding:1rem 1.1rem;
  display:flex; flex-direction:column; gap:1.1rem;
}

.filter-section{ display:flex; flex-direction:column; gap:0.55rem; }
.filter-section-head{
  display:flex; align-items:center; justify-content:space-between; gap:0.6rem; flex-wrap:wrap;
}
.filter-label{
  font-family:var(--font-mono); font-size:0.72rem; font-weight:700;
  letter-spacing:0.06em; text-transform:uppercase; color:var(--text-dim);
}
.filter-label em{ color:var(--text-faint); font-style:normal; font-weight:500; text-transform:none; letter-spacing:0; }

.mini-actions{ display:flex; gap:0.4rem; flex-wrap:wrap; }
.mini-actions button{
  font-family:var(--font-mono); font-size:0.68rem; text-transform:uppercase;
  padding:0.3rem 0.6rem; min-height:34px;
  border-radius:5px; border:1px solid var(--border); background:var(--bg-card);
  color:var(--text-dim); cursor:pointer; transition:all .15s;
}
.mini-actions button:hover{ border-color:var(--border-hover); color:var(--text); }
.read-actions button{ min-height:40px; padding:0.5rem 0.9rem; }

.chip-row{ display:flex; flex-wrap:wrap; gap:0.5rem; }

.filter-chip{
  font-family:var(--font-mono); font-size:0.75rem; font-weight:500;
  padding:0.45rem 0.8rem; min-height:38px;
  border-radius:100px; border:1px solid var(--border);
  background:var(--bg-card); color:var(--text-dim);
  cursor:pointer; transition:all .15s; user-select:none;
}
.filter-chip:hover{ border-color:var(--border-hover); color:var(--text); }
.filter-chip.chip-cyber.active{ background:rgba(0,240,255,0.12); border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 10px rgba(0,240,255,0.25); }
.filter-chip.chip-geopol.active{ background:rgba(255,42,109,0.12); border-color:var(--magenta); color:var(--magenta); box-shadow:0 0 10px rgba(255,42,109,0.25); }

.switch-row{
  display:flex; align-items:center; gap:0.6rem;
  font-family:var(--font-mono); font-size:0.8rem; color:var(--text-dim);
  cursor:pointer; min-height:32px; user-select:none;
}
.switch-row input[type="checkbox"]{
  width:18px; height:18px; accent-color:var(--purple); cursor:pointer;
}

/* =========================================================
   ACTIVE FILTERS BAR + RESULTS COUNT
   ========================================================= */
.active-filters-bar{
  max-width:1400px; margin:0 auto;
  padding:0.6rem 1.25rem 0;
  display:flex; align-items:center; gap:0.6rem; flex-wrap:wrap;
}
.active-filter-chips{ display:flex; flex-wrap:wrap; gap:0.5rem; }
.active-chip{
  display:inline-flex; align-items:center; gap:0.35rem;
  font-family:var(--font-mono); font-size:0.7rem;
  padding:0.3rem 0.35rem 0.3rem 0.7rem; border-radius:100px;
  background:rgba(185,103,255,0.1); border:1px solid var(--purple); color:var(--purple);
}
.active-chip-x{
  border:none; background:transparent; color:var(--purple); cursor:pointer;
  font-size:0.95rem; line-height:1; padding:0.15rem 0.3rem;
}
.clear-filters-btn{
  display:none; align-items:center;
  font-family:var(--font-mono); font-size:0.72rem; text-transform:uppercase;
  padding:0.4rem 0.8rem; min-height:36px;
  border-radius:100px; border:1px solid var(--magenta); background:rgba(255,42,109,0.08);
  color:var(--magenta); cursor:pointer; transition:all .15s;
}
.clear-filters-btn:hover{ box-shadow:0 0 10px rgba(255,42,109,0.35); }

.results-count{
  max-width:1400px; margin:0 auto;
  padding:0.5rem 1.25rem 0;
  font-family:var(--font-mono); font-size:0.72rem; color:var(--text-faint);
}

/* Failed-feed banner */
#fail-banner{
  max-width:1400px; margin:0 auto; padding:0 1.25rem;
  font-family:var(--font-mono); font-size:0.75rem; color:var(--amber);
  display:none; align-items:center; gap:0.5rem; flex-wrap:wrap;
  padding-bottom:0.75rem;
}
#fail-banner.show{ display:flex; }
#fail-banner b{ color:var(--amber); }

/* =========================================================
   GRID / CARDS
   ========================================================= */
main{ max-width:1400px; margin:0 auto; padding:1.25rem; }

#grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(320px, 1fr));
  gap:1rem;
}

.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1.1rem 1.2rem;
  display:flex; flex-direction:column; gap:0.6rem;
  text-decoration:none; color:var(--text);
  transition:border-color .2s, box-shadow .2s, transform .15s, opacity .2s;
  min-height:150px;
}
.card:hover, .card:focus-visible{
  transform:translateY(-2px);
  border-color:var(--card-glow, var(--cyan));
  box-shadow:0 0 22px -4px var(--card-glow, rgba(0,240,255,0.55));
}
.card.cyber{ --card-glow:var(--cat-cyber); }
.card.geopol{ --card-glow:var(--cat-geopol); }

.card-top{ display:flex; align-items:center; justify-content:space-between; gap:0.6rem; }

.chip{
  font-family:var(--font-mono); font-size:0.68rem; font-weight:700;
  letter-spacing:0.04em; text-transform:uppercase;
  padding:0.25rem 0.6rem; border-radius:100px;
  border:1px solid currentColor;
  white-space:nowrap;
}
.card.cyber .chip{ color:var(--cat-cyber); background:rgba(0,240,255,0.08); }
.card.geopol .chip{ color:var(--cat-geopol); background:rgba(255,42,109,0.08); }

.timestamp{ font-family:var(--font-mono); font-size:0.72rem; color:var(--text-faint); white-space:nowrap; }

.headline{
  font-weight:700; font-size:1rem; line-height:1.35;
  color:var(--text);
}
.card:hover .headline{ color:var(--card-glow, var(--cyan)); }

.snippet{
  font-size:0.85rem; line-height:1.5; color:var(--text-dim);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden;
}

.card-bottom{
  margin-top:auto; display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:0.7rem; color:var(--text-faint);
}

/* Watchlist highlight — third accent colour, distinct from cyan/magenta */
.card.watchlist{
  border-color:var(--cat-watchlist);
  box-shadow:0 0 0 1px rgba(255,176,46,0.4), 0 0 18px -2px rgba(255,176,46,0.5);
}
.card.watchlist:hover{
  border-color:var(--cat-watchlist);
  box-shadow:0 0 0 1px rgba(255,176,46,0.6), 0 0 26px -2px rgba(255,176,46,0.75);
}
.card.watchlist:hover .headline{ color:var(--cat-watchlist); }
.watchlist-tag{
  align-self:flex-start;
  font-family:var(--font-mono); font-size:0.65rem; font-weight:700;
  letter-spacing:0.05em; color:var(--cat-watchlist);
  background:rgba(255,176,46,0.1); border:1px solid var(--cat-watchlist);
  padding:0.15rem 0.5rem; border-radius:100px;
}

/* Seen / read articles — dimmed, not hidden */
.card.seen{ opacity:0.42; }
.card.seen:hover{ opacity:0.78; }

/* Skeleton loading cards */
.skeleton{
  background:var(--bg-card); border:1px solid var(--border); border-radius:10px;
  padding:1.1rem 1.2rem; min-height:150px; display:flex; flex-direction:column; gap:0.7rem;
}
.skel-line{
  height:0.7rem; border-radius:4px;
  background:linear-gradient(90deg, var(--border) 25%, #2a2a3a 50%, var(--border) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite linear;
}
@keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
.skel-line.chip-w{ width:35%; height:1.1rem; border-radius:100px; }
.skel-line.w-90{ width:90%; }
.skel-line.w-70{ width:70%; }
.skel-line.w-50{ width:50%; }

.empty-state{
  grid-column:1/-1; text-align:center; padding:3rem 1rem;
  color:var(--text-faint); font-family:var(--font-mono); font-size:0.9rem;
}

footer{
  max-width:1400px; margin:0 auto; padding:1.5rem 1.25rem 0.5rem;
  font-family:var(--font-mono); font-size:0.7rem; color:var(--text-faint);
  text-align:center;
}

/* Landscape / larger screens: a touch more breathing room */
@media (min-width:900px){
  #grid{ grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:1.25rem; }
}
@media (max-width:480px){
  .header-inner{ padding:0.8rem 1rem 0.6rem; }
  .search-row{ padding:0 1rem 0.7rem; }
  .tabs{ padding:0 1rem 0.8rem; }
  #filter-panel{ padding:0 1rem; }
  .active-filters-bar{ padding:0.6rem 1rem 0; }
  .results-count{ padding:0.5rem 1rem 0; }
  main{ padding:1rem; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo" data-text="// CYBERFEED">// CYBERFEED</div>
    </div>
    <div class="controls">
      <div class="status-line">
        <span class="status-dot"></span>
        <span id="last-updated">never updated</span>
      </div>
      <button id="filter-toggle-btn" class="icon-btn" title="Toggle filters" aria-label="Toggle filters">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
        </svg>
        <span id="filter-badge" class="filter-badge" hidden>0</span>
      </button>
      <button id="refresh-btn" class="icon-btn" title="Refresh feeds" aria-label="Refresh feeds">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
          <path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="search-row">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search headlines & summaries…" autocomplete="off" spellcheck="false">
      <button id="search-clear" class="search-clear" aria-label="Clear search" hidden>&times;</button>
    </div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-tab="all">ALL <span class="count" id="count-all">0</span></div>
    <div class="tab" data-tab="cyber">Cyber <span class="count" id="count-cyber">0</span></div>
    <div class="tab" data-tab="geopol">Geopol <span class="count" id="count-geopol">0</span></div>
  </div>

  <div id="filter-panel">
    <div class="filter-panel-inner">

      <div class="filter-section">
        <div class="filter-section-head">
          <span class="filter-label">Noise filter</span>
        </div>
        <label class="switch-row" for="noise-toggle">
          <input type="checkbox" id="noise-toggle">
          <span>Show filtered noise (reveal blocklisted articles)</span>
        </label>
      </div>

      <div class="filter-section">
        <div class="filter-section-head">
          <span class="filter-label">Region / country <em>(applies to geopol only)</em></span>
        </div>
        <div class="chip-row" id="country-chips"></div>
      </div>

      <div class="filter-section">
        <div class="filter-section-head">
          <span class="filter-label">Cyber category <em>(applies to cyber only)</em></span>
        </div>
        <div class="chip-row" id="cybercat-chips"></div>
      </div>

      <div class="filter-section">
        <div class="filter-section-head">
          <span class="filter-label">Sources — cyber</span>
          <span class="mini-actions">
            <button type="button" data-group="cyber" data-action="all">All</button>
            <button type="button" data-group="cyber" data-action="none">None</button>
          </span>
        </div>
        <div class="chip-row" id="source-chips-cyber"></div>
      </div>

/* =========================================================

/* =========================================================

const CYBER_CATEGORIES = {

/* =========================================================
   WATCHLIST — high-priority terms for role-relevance
   highlighting. Matching articles get a glowing amber border,
   a "⚡ WATCHLIST" tag, and sort to the top of their view.
   ========================================================= */
const WATCHLIST = [
  "volt typhoon", "voltzite", "energy", "power grid", "scada", "ics",
  " ot ", "critical infrastructure", "cni", "desnz", "utility", "utilities",
  "substation", "nuclear", "pipeline", "water treatment"
];

const CONFIG = {
  RSS2JSON_ENDPOINT: "https://api.rss2json.com/v1/api.json?rss_url=",
  ALLORIGINS_ENDPOINT: "https://api.allorigins.win/raw?url=",
  REFRESH_INTERVAL_MS: 15 * 60 * 1000, // 15 minutes
  SNIPPET_MAX_LEN: 200,
  SKELETON_COUNT: 9
};

const PREFS_KEY = "cyberfeed:prefs:v1";

/* =========================================================
   STATE
   ========================================================= */
const state = {
  articles: [],      // flattened, normalised articles from all feeds
  failedSources: [],  // display names of feeds that failed both proxies this cycle
  activeTab: "all",
  loading: false,
  everLoaded: false,

  // filters
  activeCountries: new Set(),        // selected keys of COUNTRY_KEYWORDS
  activeCyberCategories: new Set(),  // selected keys of CYBER_CATEGORIES
  disabledSources: new Set(),        // feed names toggled OFF
  showNoise: false,                  // reveal blocklisted ("noise") articles
  searchQuery: "",                   // free-text search (not persisted)
  seenLinks: new Set()               // localStorage-persisted read article URLs
};

/* =========================================================
   HELPERS
   ========================================================= */

// Strip HTML tags from a string safely using an inert DOMParser document
// (parsed-but-not-inserted documents don't execute scripts or load resources).
function stripHtml(html) {
  if (!html) return "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  return (doc.body.textContent || "").replace(/\s+/g, " ").trim();
}

function truncate(str, max) {
  if (!str || str.length <= max) return str || "";
  return str.slice(0, max).replace(/\s+\S*$/, "") + "…";
}

function parseDate(raw) {
  if (!raw) return null;
  const d = new Date(raw);
  return isNaN(d.getTime()) ? null : d;
}

function timeAgo(date) {
  if (!date) return "unknown date";
  const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
  if (seconds < 0) return "just now";
  if (seconds < 60) return "just now";
  const mins = Math.floor(seconds / 60);
  if (mins < 60) return `${mins}m ago`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.floor(hours / 24);
  if (days < 7) return `${days}d ago`;
  return date.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function getLink(el) {
  const linkEl = el.querySelector("link");
  if (!linkEl) return "";
  return linkEl.getAttribute("href") || linkEl.textContent.trim();
}

function getText(el, tag) {
  const node = el.querySelector(tag);
  return node ? node.textContent.trim() : "";
}

function toggleSetMember(set, value) {
  if (set.has(value)) set.delete(value);
  else set.add(value);
}

// True if `haystack` contains any of `keywords` (case-insensitive substring match).
function matchesAny(haystack, keywords) {
  return keywords.some(k => haystack.includes(k.toLowerCase()));
}

function matchesCountry(article, countries) {
  if (!countries.size) return true; // no selection = show all geopol
  for (const c of countries) {
    if (matchesAny(article._hay, COUNTRY_KEYWORDS[c] || [])) return true;
  }
  return false;
}

function matchesCyberCategory(article, cats) {
  if (!cats.size) return true; // no selection = show all cyber
  for (const c of cats) {
    if (matchesAny(article._hay, CYBER_CATEGORIES[c] || [])) return true;
  }
  return false;
}

// Precompute per-article search text and keyword-derived flags once per load.
function computeFlags(article) {
  article._hay = (article.title + " " + article.description).toLowerCase();
  article._noise = matchesAny(article._hay, BLOCKLIST);
  article._watch = matchesAny(article._hay, WATCHLIST);
}

/* =========================================================
   PERSISTENCE — localStorage
   ========================================================= */

function savePrefs() {
  const prefs = {
    activeTab: state.activeTab,
    activeCountries: [...state.activeCountries],
    activeCyberCategories: [...state.activeCyberCategories],
    disabledSources: [...state.disabledSources],
    showNoise: state.showNoise,
    seenLinks: [...state.seenLinks]
  };
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) { /* storage unavailable */ }
}

function loadPrefs() {
  try {
    const raw = localStorage.getItem(PREFS_KEY);
    if (!raw) return;
    const prefs = JSON.parse(raw);
    if (typeof prefs.activeTab === "string") state.activeTab = prefs.activeTab;
    if (Array.isArray(prefs.activeCountries)) state.activeCountries = new Set(prefs.activeCountries);
    if (Array.isArray(prefs.activeCyberCategories)) state.activeCyberCategories = new Set(prefs.activeCyberCategories);
    if (Array.isArray(prefs.disabledSources)) state.disabledSources = new Set(prefs.disabledSources);
    if (typeof prefs.showNoise === "boolean") state.showNoise = prefs.showNoise;
    if (Array.isArray(prefs.seenLinks)) state.seenLinks = new Set(prefs.seenLinks);
  } catch (e) { /* corrupt storage, ignore */ }
}

/* =========================================================
   FETCHING — primary: rss2json (clean JSON)
              fallback: allorigins raw + manual XML parse
   ========================================================= */

async function fetchViaRss2json(feed) {
  const apiUrl = CONFIG.RSS2JSON_ENDPOINT + encodeURIComponent(feed.url);
  const res = await fetch(apiUrl);
  if (!res.ok) throw new Error("rss2json HTTP " + res.status);
  const data = await res.json();
  if (data.status !== "ok" || !Array.isArray(data.items)) {
    throw new Error("rss2json returned non-ok status");
  }
  return data.items.map(item => ({
    title: stripHtml(item.title) || "(untitled)",
    link: item.link || "#",
    pubDate: parseDate(item.pubDate),
    description: truncate(stripHtml(item.description || item.content || ""), CONFIG.SNIPPET_MAX_LEN),
    source: feed.name,
    category: feed.category
  }));
}

async function fetchViaAllOrigins(feed) {
  const apiUrl = CONFIG.ALLORIGINS_ENDPOINT + encodeURIComponent(feed.url);
  const res = await fetch(apiUrl);
  if (!res.ok) throw new Error("allorigins HTTP " + res.status);
  const text = await res.text();
  const xml = new DOMParser().parseFromString(text, "application/xml");
  if (xml.querySelector("parsererror")) throw new Error("XML parse error");

  const items = Array.from(xml.querySelectorAll("item, entry"));
  if (!items.length) throw new Error("no items found in feed");

  return items.map(el => {
    const rawDate = getText(el, "pubDate") || getText(el, "updated") || getText(el, "published");
    const rawDesc = getText(el, "description") || getText(el, "summary") || getText(el, "content");
    return {
      title: stripHtml(getText(el, "title")) || "(untitled)",
      link: getLink(el) || "#",
      pubDate: parseDate(rawDate),
      description: truncate(stripHtml(rawDesc), CONFIG.SNIPPET_MAX_LEN),
      source: feed.name,
      category: feed.category
    };
  });
}

// Try rss2json first; on any failure, fall back to allorigins.
// Never throws — always resolves with { ok, feed, items }.
async function fetchFeedWithFallback(feed) {
  try {
    return { feed, items: await fetchViaRss2json(feed), ok: true };
  } catch (err1) {
    try {
      return { feed, items: await fetchViaAllOrigins(feed), ok: true };
    } catch (err2) {
      console.warn(`[CYBERFEED] Feed unavailable: ${feed.name}`, err1, err2);
      return { feed, items: [], ok: false };
    }
  }
}

async function loadAll() {
  state.loading = true;
  updateRefreshButton();

  const allFeeds = [
    ...FEEDS.cyber.map(f => ({ ...f, category: "cyber" })),
    ...FEEDS.geopol.map(f => ({ ...f, category: "geopol" }))
  ];

  if (!state.everLoaded) renderSkeletons();

  const results = await Promise.allSettled(allFeeds.map(fetchFeedWithFallback));

  const articles = [];
  const failed = [];
  results.forEach(r => {
    if (r.status === "fulfilled") {
      const { feed, items, ok } = r.value;
      if (!ok) failed.push(feed.name);
      articles.push(...items);
    }
  });

  articles.forEach(computeFlags);

  state.articles = articles;
  state.failedSources = failed;
  state.loading = false;
  state.everLoaded = true;

  document.getElementById("last-updated").textContent =
    "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  updateRefreshButton();
  render();
}

/* =========================================================
   FILTERING + SORTING
   ========================================================= */

function sortByDateDesc(list) {
  return [...list].sort((a, b) => {
    const ta = a.pubDate ? a.pubDate.getTime() : 0;
    const tb = b.pubDate ? b.pubDate.getTime() : 0;
    return tb - ta;
  });
}

// Watchlisted articles sort to the top (newest-first within each group).
function sortForDisplay(list) {
  const watch = list.filter(a => a._watch);
  const rest = list.filter(a => !a._watch);
  return [...sortByDateDesc(watch), ...sortByDateDesc(rest)];
}

// Applies source toggle, noise blocklist, country filter, cyber-category
// filter and free-text search. Filter types combine with AND; selections
// within a type combine with OR. Tab selection is applied separately.
function getVisibleArticles() {
  return state.articles.filter(a => {
    if (state.disabledSources.has(a.source)) return false;
    if (!state.showNoise && a._noise) return false;
    if (a.category === "geopol" && !matchesCountry(a, state.activeCountries)) return false;
    if (a.category === "cyber" && !matchesCyberCategory(a, state.activeCyberCategories)) return false;
    if (state.searchQuery && !a._hay.includes(state.searchQuery.toLowerCase())) return false;
    return true;
  });
}

/* =========================================================
   RENDERING
   ========================================================= */

function renderSkeletons() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (let i = 0; i < CONFIG.SKELETON_COUNT; i++) {
    const el = document.createElement("div");
    el.className = "skeleton";
    el.innerHTML = `
      <div class="skel-line chip-w"></div>
      <div class="skel-line w-90"></div>
      <div class="skel-line w-70"></div>
      <div class="skel-line w-50"></div>
    `;
    grid.appendChild(el);
  }
}

function buildCard(article) {
  const card = document.createElement("a");
  const classes = ["card", article.category];
  if (article._watch) classes.push("watchlist");
  if (state.seenLinks.has(article.link)) classes.push("seen");
  card.className = classes.join(" ");
  card.href = article.link;
  card.target = "_blank";
  card.rel = "noopener noreferrer";
  card.dataset.link = article.link;

  const top = document.createElement("div");
  top.className = "card-top";

  const chip = document.createElement("span");
  chip.className = "chip";
  chip.textContent = article.source;

  const ts = document.createElement("span");
  ts.className = "timestamp";
  ts.textContent = timeAgo(article.pubDate);

  top.appendChild(chip);
  top.appendChild(ts);
  card.appendChild(top);

  if (article._watch) {
    const tag = document.createElement("div");
    tag.className = "watchlist-tag";
    tag.textContent = "⚡ WATCHLIST";
    card.appendChild(tag);
  }

  const headline = document.createElement("div");
  headline.className = "headline";
  headline.textContent = article.title;
  card.appendChild(headline);

  if (article.description) {
    const snippet = document.createElement("div");
    snippet.className = "snippet";
    snippet.textContent = article.description;
    card.appendChild(snippet);
  }

  const bottom = document.createElement("div");
  bottom.className = "card-bottom";
  bottom.innerHTML = `<span>${article.category === "cyber" ? "CYBER" : "GEOPOL"}</span><span>↗ open</span>`;
  card.appendChild(bottom);

  return card;
}

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const visible = getVisibleArticles();
  const visCyber = visible.filter(a => a.category === "cyber");
  const visGeopol = visible.filter(a => a.category === "geopol");

  document.getElementById("count-all").textContent = visible.length;
  document.getElementById("count-cyber").textContent = visCyber.length;
  document.getElementById("count-geopol").textContent = visGeopol.length;

  let list, totalInTab;
  if (state.activeTab === "cyber") {
    list = visCyber;
    totalInTab = state.articles.filter(a => a.category === "cyber").length;
  } else if (state.activeTab === "geopol") {
    list = visGeopol;
    totalInTab = state.articles.filter(a => a.category === "geopol").length;
  } else {
    list = visible;
    totalInTab = state.articles.length;
  }

  list = sortForDisplay(list);

  const countsEl = document.getElementById("results-count");
  countsEl.textContent = state.everLoaded ? `Showing ${list.length} of ${totalInTab}` : "";

  if (!list.length) {
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.textContent = state.loading
      ? "Loading feeds…"
      : (state.articles.length ? "No articles match current filters." : "No articles loaded for this view yet.");
    grid.appendChild(empty);
  } else {
    const frag = document.createDocumentFragment();
    list.forEach(a => frag.appendChild(buildCard(a)));
    grid.appendChild(frag);
  }

  renderFailBanner();
  renderActiveFilters();
}

function renderFailBanner() {
  const banner = document.getElementById("fail-banner");
  if (!state.failedSources.length) {
    banner.classList.remove("show");
    banner.textContent = "";
    return;
  }
  banner.classList.add("show");
  banner.innerHTML = `⚠ Feed unavailable: <b>${state.failedSources.map(s => escapeText(s)).join(", ")}</b>`;
}

function escapeText(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function updateRefreshButton() {
  const btn = document.getElementById("refresh-btn");
  btn.classList.toggle("spinning", state.loading);
}

/* =========================================================
   FILTER PANEL UI — chips, toggles, active-filter bar
   ========================================================= */

function makeToggleChip(label, isActive, colorClass, onClick) {
  const el = document.createElement("button");
  el.type = "button";
  el.className = "filter-chip" + (colorClass ? " " + colorClass : "") + (isActive ? " active" : "");
  el.textContent = label;
  el.addEventListener("click", onClick);
  return el;
}

function renderCountryChips() {
  const wrap = document.getElementById("country-chips");
  wrap.innerHTML = "";
  Object.keys(COUNTRY_KEYWORDS).forEach(name => {
    wrap.appendChild(makeToggleChip(name, state.activeCountries.has(name), "chip-geopol", () => {
      toggleSetMember(state.activeCountries, name);
      savePrefs();
      renderCountryChips();
      render();
    }));
  });
}

function renderCyberCatChips() {
  const wrap = document.getElementById("cybercat-chips");
  wrap.innerHTML = "";
  Object.keys(CYBER_CATEGORIES).forEach(name => {
    wrap.appendChild(makeToggleChip(name, state.activeCyberCategories.has(name), "chip-cyber", () => {
      toggleSetMember(state.activeCyberCategories, name);
      savePrefs();
      renderCyberCatChips();
      render();
    }));
  });
}

function renderSourceChips() {
  const cyberWrap = document.getElementById("source-chips-cyber");
  const geoWrap = document.getElementById("source-chips-geopol");
  cyberWrap.innerHTML = "";
  geoWrap.innerHTML = "";

  FEEDS.cyber.forEach(f => cyberWrap.appendChild(makeSourceChip(f.name, "chip-cyber")));
  FEEDS.geopol.forEach(f => geoWrap.appendChild(makeSourceChip(f.name, "chip-geopol")));
}

function makeSourceChip(name, colorClass) {
  const enabled = !state.disabledSources.has(name);
  return makeToggleChip(name, enabled, colorClass, () => {
    toggleSetMember(state.disabledSources, name);
    savePrefs();
    renderSourceChips();
    render();
  });
}

function makeRemovableChip(label, onRemove) {
  const chip = document.createElement("span");
  chip.className = "active-chip";
  const text = document.createElement("span");
  text.textContent = label;
  const x = document.createElement("button");
  x.type = "button";
  x.className = "active-chip-x";
  x.textContent = "×";
  x.setAttribute("aria-label", "Remove filter: " + label);
  x.addEventListener("click", onRemove);
  chip.appendChild(text);
  chip.appendChild(x);
  return chip;
}

function activeFilterCount() {
  let n = state.activeCountries.size + state.activeCyberCategories.size;
  if (state.disabledSources.size) n += 1;
  if (state.searchQuery) n += 1;
  return n;
}

function renderActiveFilters() {
  const wrap = document.getElementById("active-filter-chips");
  wrap.innerHTML = "";

  state.activeCountries.forEach(c => {
    wrap.appendChild(makeRemovableChip(`Region: ${c}`, () => {
      state.activeCountries.delete(c);
      savePrefs();
      renderCountryChips();
      render();
    }));
  });

  state.activeCyberCategories.forEach(c => {
    wrap.appendChild(makeRemovableChip(`Category: ${c}`, () => {
      state.activeCyberCategories.delete(c);
      savePrefs();
      renderCyberCatChips();
      render();
    }));
  });

  if (state.disabledSources.size) {
    wrap.appendChild(makeRemovableChip(`${state.disabledSources.size} source(s) hidden`, () => {
      state.disabledSources.clear();
      savePrefs();
      renderSourceChips();
      render();
    }));
  }

  if (state.searchQuery) {
    wrap.appendChild(makeRemovableChip(`Search: "${state.searchQuery}"`, () => {
      state.searchQuery = "";
      document.getElementById("search-input").value = "";
      document.getElementById("search-clear").hidden = true;
      render();
    }));
  }

  const count = activeFilterCount();

  const clearBtn = document.getElementById("clear-filters-btn");
  clearBtn.style.display = count ? "inline-flex" : "none";

  const badge = document.getElementById("filter-badge");
  if (count) {
    badge.hidden = false;
    badge.textContent = String(count);
  } else {
    badge.hidden = true;
  }
}

/* =========================================================
   EVENT WIRING
   ========================================================= */

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  tab.classList.add("active");
  state.activeTab = tab.dataset.tab;
  savePrefs();
  render();
});

document.getElementById("refresh-btn").addEventListener("click", () => {
  if (state.loading) return;
  loadAll();
});

document.getElementById("filter-toggle-btn").addEventListener("click", () => {
  const panel = document.getElementById("filter-panel");
  const btn = document.getElementById("filter-toggle-btn");
  panel.classList.toggle("open");
  btn.classList.toggle("active-state", panel.classList.contains("open"));
});

document.getElementById("noise-toggle").addEventListener("change", (e) => {
  state.showNoise = e.target.checked;
  savePrefs();
  render();
});

document.getElementById("filter-panel").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-group]");
  if (!btn) return;
  const group = btn.dataset.group;   // "cyber" | "geopol"
  const action = btn.dataset.action; // "all" | "none"
  const names = FEEDS[group].map(f => f.name);
  if (action === "all") names.forEach(n => state.disabledSources.delete(n));
  else names.forEach(n => state.disabledSources.add(n));
  savePrefs();
  renderSourceChips();
  render();
});

document.getElementById("mark-all-read-btn").addEventListener("click", () => {
  state.articles.forEach(a => state.seenLinks.add(a.link));
  savePrefs();
  render();
});

document.getElementById("clear-read-btn").addEventListener("click", () => {
  state.seenLinks.clear();
  savePrefs();
  render();
});

document.getElementById("clear-filters-btn").addEventListener("click", () => {
  state.activeCountries.clear();
  state.activeCyberCategories.clear();
  state.disabledSources.clear();
  state.searchQuery = "";
  document.getElementById("search-input").value = "";
  document.getElementById("search-clear").hidden = true;
  savePrefs();
  renderCountryChips();
  renderCyberCatChips();
  renderSourceChips();
  render();
});

const searchInput = document.getElementById("search-input");
const searchClearBtn = document.getElementById("search-clear");
searchInput.addEventListener("input", () => {
  state.searchQuery = searchInput.value.trim();
  searchClearBtn.hidden = !state.searchQuery;
  render();
});
searchClearBtn.addEventListener("click", () => {
  searchInput.value = "";
  state.searchQuery = "";
  searchClearBtn.hidden = true;
  render();
  searchInput.focus();
});

// Mark an article as seen (read) the moment its card is clicked/opened.
// Non-destructive: the article stays in the list, just dimmed via CSS.
document.getElementById("grid").addEventListener("click", (e) => {
  const card = e.target.closest("a.card");
  if (!card) return;
  const link = card.dataset.link;
  if (!link || state.seenLinks.has(link)) return;
  state.seenLinks.add(link);
  card.classList.add("seen");
  savePrefs();
});

// Refresh relative timestamps periodically without refetching
setInterval(() => { if (!state.loading) render(); }, 60 * 1000);

/* =========================================================
   INIT — restore persisted prefs, build filter UI, first load
   ========================================================= */
loadPrefs();

document.querySelectorAll(".tab").forEach(t => {
  t.classList.toggle("active", t.dataset.tab === state.activeTab);
});
document.getElementById("noise-toggle").checked = state.showNoise;

renderCountryChips();
renderCyberCatChips();
renderSourceChips();
renderActiveFilters();

loadAll();
setInterval(loadAll, CONFIG.REFRESH_INTERVAL_MS);
</script>

</body>
</html>
